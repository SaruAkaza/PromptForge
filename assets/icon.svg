<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="forgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#forgeGrad)" stroke-width="6" opacity="0.6"/>

  <!-- Glowing background aura -->
  <circle cx="256" cy="256" r="130" fill="#3B82F6" opacity="0.18" filter="url(#glow)"/>

  <!-- Anvil / Forge Shape & Spark AI Sparkle -->
  <g transform="translate(48, 56)">
    <!-- Magic Sparkles -->
    <path d="M208 40 L216 68 L244 76 L216 84 L208 112 L200 84 L172 76 L200 68 Z" fill="#F59E0B" filter="url(#glow)"/>
    <path d="M96 110 L102 128 L120 134 L102 140 L96 158 L90 140 L72 134 L90 128 Z" fill="#38BDF8"/>
    <path d="M310 140 L315 155 L330 160 L315 165 L310 180 L305 165 L290 160 L305 155 Z" fill="#A855F7"/>

    <!-- Central Monolith / Stylized Prompt Shield & Anvil -->
    <path d="M96 220 C96 210, 108 200, 128 200 L288 200 C308 200, 320 210, 320 220 L300 270 C295 285, 270 300, 240 300 L230 330 L270 360 L270 380 L146 380 L146 360 L186 330 L176 300 C146 300, 121 285, 116 270 Z" 
          fill="url(#forgeGrad)" filter="url(#glow)"/>
          
    <!-- Prompt Command Line Prompt Indicator '>_' in the center -->
    <path d="M170 236 L195 252 L170 268" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="208" y1="268" x2="236" y2="268" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
